<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Inteligente - MVC Completo</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .app-container { 
            width: 100%; 
            max-width: 800px; 
            background: var(--card-bg); 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            padding: 30px; 
            box-sizing: border-box; 
        }
        h1, h2, h3 { 
            color: var(--primary); 
            margin-top: 0; 
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }
        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        button:hover { 
            background-color: var(--primary-hover); 
        }
        .hidden { 
            display: none !important; 
        }
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-top: 15px; 
        }
        .option-card { 
            background: #f1f5f9; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: all 0.2s; 
        }
        .option-card:hover { 
            border-color: var(--primary); 
            background: #e0e7ff; 
        }
        .feedback-box { 
            background: #eff6ff; 
            border-left: 4px solid var(--primary); 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 0 6px 6px 0; 
        }
        .link { 
            color: var(--primary); 
            cursor: pointer; 
            text-decoration: underline; 
            text-align: center; 
            display: block; 
            margin-top: 10px; 
        }
        .nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
        .nav-links span { 
            margin: 0 10px; 
            cursor: pointer; 
            font-weight: 600; 
            color: var(--text-muted); 
        }
        .nav-links span.active { 
            color: var(--primary); 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 4px; 
        }
        .badge { 
            background: #fee2e2; 
            color: #991b1b; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.85rem; 
            font-weight: bold; 
        }
        .badge-success { 
            background: #d1fae5; 
            color: #065f46; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        th, td { 
            border: 1px solid #e2e8f0; 
            padding: 10px; 
            text-align: left; 
            font-size: 0.95rem; 
        }
        th { 
            background: #f1f5f9; 
        }

        /* Estructura principal en dos bandas lado a lado */
        .secciones-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: stretch;
            text-align: left;
        }

        /* Columna de Alumnos (Flanco Izquierdo) */
        .columna-alumnos {
            flex: 1.2;
            padding-right: 15px;
        }

        /* Columna de Maestros (Flanco Derecho con fondo destacado) */
        .columna-maestros {
            flex: 0.8;
            background-color: #edf5f0;
            border-left: 2px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Títulos de sección */
        .titulo-seccion {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #1e293b;
            text-transform: uppercase;
        }

        /* Botón verde de Soy Maestro */
        .btn-maestro {
            background-color: #48a668;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-maestro:hover {
            background-color: #3d8f59;
        }

        /* Ajuste de enlaces */
        .link-sub {
            color: #3b82f6;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 6px;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- 1. VISTA INICIO / BIENVENIDA -->
        <div id="view-inicio" class="view" style="text-align: center;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <span style="font-size: 2rem;">🎓🤖</span>
                <h2 style="margin: 0;">Aula Inteligente</h2>
            </div>
            <p>¡Bienvenido! Aprende Matemáticas y Español a tu ritmo.</p>
            <button style="padding: 16px; font-size: 1.1rem; background-color: #f97316; margin-top: 15px;">¡COMENZAR EL APRENDIZAJE!</button>

            <!-- CONTENEDOR DE DOS COLUMNAS DE ACCESO -->
            <div class="secciones-container">

                <!-- SECCIÓN ALUMNOS -->
                <div class="columna-alumnos">
                    <div class="titulo-seccion">SECCIÓN ALUMNOS</div>
                    <input type="text" id="log-alumno-usuario" placeholder="Nombre o ID (nombre)">
                    <input type="password" id="log-alumno-password" placeholder="Contraseña">
                    <!-- Abre la pantalla independiente de registro de alumno en una pestaña nueva -->
                    <span class="link-sub" onclick="window.open('registro-alumno.html', '_blank')">Crear cuenta de Alumno</span>
                </div>

                <!-- SECCIÓN MAESTROS -->
                <div class="columna-maestros">
                    <div class="titulo-seccion">SECCIÓN MAESTROS</div>
                    <!-- Botón para registrarse -->
                    <button class="btn-maestro" onclick="window.open('registro-maestro.html', '_blank')">Soy Maestro</button>
                    <!-- Enlace corregido para abrir el registro de maestro -->
                    <span class="link-sub" onclick="window.open('registro-maestro.html', '_blank')">Registrarse como Maestro</span>
                    <span class="link-sub" onclick="alert('Próximamente: Panel de acceso para maestros en Firestore')">Acceso Maestros</span>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
