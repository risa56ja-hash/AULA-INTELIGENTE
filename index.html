<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Inteligente - MVC Completo</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .app-container { 
            width: 100%; 
            max-width: 800px; 
            background: var(--card-bg); 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            padding: 30px; 
            box-sizing: border-box; 
        }
        h1, h2, h3 { 
            color: var(--primary); 
            margin-top: 0; 
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }
        button { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s; 
        }
        button:hover { 
            background-color: var(--primary-hover); 
        }
        .hidden { 
            display: none !important; 
        }

        /* Estructura principal en dos bandas lado a lado */
        .secciones-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: stretch;
            text-align: left;
        }

        /* Columna de Alumnos (Flanco Izquierdo) */
        .columna-alumnos {
            flex: 1.2;
            padding-right: 15px;
        }

        /* Columna de Maestros (Flanco Derecho con fondo destacado) */
        .columna-maestros {
            flex: 0.8;
            background-color: #edf5f0;
            border-left: 2px solid #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Títulos de sección */
        .titulo-seccion {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #1e293b;
            text-transform: uppercase;
        }

        /* Botón verde de Soy Maestro */
        .btn-maestro {
            background-color: #48a668;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-maestro:hover {
            background-color: #3d8f59;
        }

        /* Ajuste de enlaces */
        .link-sub {
            color: #3b82f6;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 6px;
            text-align: center;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- 1. VISTA INICIO / BIENVENIDA -->
        <div id="view-inicio" class="view" style="text-align: center;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <span style="font-size: 2rem;">🎓🤖</span>
                <h2 style="margin: 0;">Aula Inteligente</h2>
            </div>
            <p>¡Bienvenido! Aprende Matemáticas y Español a tu ritmo.</p>
            
            <!-- BOTÓN PRINCIPAL PARA INICIAR SESIÓN COMO ALUMNO -->
            <button id="btn-login-alumno" style="padding: 16px; font-size: 1.1rem; background-color: #f97316; margin-top: 15px;">¡COMENZAR EL APRENDIZAJE!</button>

            <!-- CONTENEDOR DE DOS COLUMNAS DE ACCESO -->
            <div class="secciones-container">

                <!-- SECCIÓN ALUMNOS -->
                <div class="columna-alumnos">
                    <div class="titulo-seccion">SECCIÓN ALUMNOS</div>
                    <input type="text" id="log-alumno-usuario" placeholder="Nombre o ID (nombre)">
                    <input type="password" id="log-alumno-password" placeholder="Contraseña">
                    <span class="link-sub" onclick="window.open('registro-alumno.html', '_blank')">Crear cuenta de Alumno</span>
                </div>

                <!-- SECCIÓN MAESTROS -->
                <div class="columna-maestros">
                    <div class="titulo-seccion">SECCIÓN MAESTROS</div>
                    <button class="btn-maestro" onclick="window.open('registro-maestro.html', '_blank')">Soy Maestro</button>
                    <span class="link-sub" onclick="window.open('registro-maestro.html', '_blank')">Registrarse como Maestro</span>
                    <span class="link-sub" onclick="alert('Próximamente: Panel de acceso para maestros en Firestore')">Acceso Maestros</span>
                </div>

            </div>
        </div>

    </div>

    <!-- SCRIPT MODULAR PARA INICIAR SESIÓN CON FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCR66VKjOx8iXJMxEBLejY6qLKIZ53FVLw",
            authDomain: "aula-inteligente-9a55e.firebaseapp.com",
            projectId: "aula-inteligente-9a55e",
            storageBucket: "aula-inteligente-9a55e.firebasestorage.app",
            messagingSenderId: "982907961913",
            appId: "1:982907961913:web:529e99b299f214ce9483e8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById("btn-login-alumno").addEventListener("click", async () => {
            const usuarioIngresado = document.getElementById("log-alumno-usuario").value.trim();
            const passwordIngresada = document.getElementById("log-alumno-password").value;
            const btnLogin = document.getElementById("btn-login-alumno");

            if (!usuarioIngresado || !passwordIngresada) {
                alert("¡Por favor ingresa tu ID de usuario y tu contraseña!");
                return;
            }

            try {
                btnLogin.textContent = "Verificando jugada...";
                btnLogin.disabled = true;

                // Estrategia táctica: Obtenemos todos los grupos primero
                const gruposSnapshot = await getDocs(collection(db, "grupos"));
                let usuarioValido = false;
                let datosAlumno = null;

                // Recorremos cada grupo para buscar en su subcolección "alumnos" localmente
                for (const grupoDoc of gruposSnapshot.docs) {
                    const alumnosRef = collection(db, "grupos", grupoDoc.id, "alumnos");
                    const alumnosSnapshot = await getDocs(alumnosRef);

                    alumnosSnapshot.forEach((docAlumno) => {
                        const data = docAlumno.data();
                        if (data.usuario === usuarioIngresado && data.password === passwordIngresada) {
                            usuarioValido = true;
                            datosAlumno = data;
                        }
                    });
                }

                if (usuarioValido) {
                    localStorage.setItem("alumno_nombre", datosAlumno.nombre);
                    window.location.href = "panel-alumno.html";
                } else {
                    alert("❌ Usuario o contraseña incorrectos. Inténtalo de nuevo.");
                    btnLogin.textContent = "¡COMENZAR EL APRENDIZAJE!";
                    btnLogin.disabled = false;
                }

            } catch (error) {
                console.error("Error detallado en Firebase: ", error);
                alert("Error al conectar con Firebase: " + error.message);
                btnLogin.textContent = "¡COMENZAR EL APRENDIZAJE!";
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
